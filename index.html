
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sameem Chat</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10B981">
        <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Configure Tailwind to use the 'class' strategy for dark mode
      tailwind.config = {
        darkMode: 'class'
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
      }

      /* Glass Theme Base Styles */
      .glass body {
        background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        min-height: 100vh;
      }
      
      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Frosted Glass Panes */
      .glass .bg-white, .glass .dark\:bg-black, .glass .dark\:bg-gray-800, .glass .dark\:bg-gray-900, .glass .dark\:bg-\[\#1e293b\], .glass .bg-gray-100, .glass .bg-gray-50, .glass .dark\:bg-\[\#0f172a\] {
        background-color: rgba(255, 255, 255, 0.15) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2) !important;
        color: white !important;
      }

      /* Base structure specific overrides for complete transparency where needed */
      .glass #root > div > div {
         background-color: transparent !important;
         box-shadow: none !important;
         backdrop-filter: none !important;
         border: none !important;
      }
      
      /* Glass Buttons and Inputs */
      .glass input, .glass textarea, .glass .bg-gray-200.dark\:bg-gray-700 {
        background-color: rgba(0, 0, 0, 0.2) !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        color: white !important;
        outline: none !important;
      }
      .glass input::placeholder, .glass textarea::placeholder {
        color: rgba(255, 255, 255, 0.6) !important;
      }

      /* Text color overrides for Glass mode to ensure legibility */
      .glass [class*="text-gray-"], .glass [class*="text-black"], .glass .text-black {
        color: rgba(255, 255, 255, 0.95) !important;
      }
      
      /* SVG Icons override */
      .glass svg.text-gray-400, .glass svg.text-gray-500, .glass svg.text-gray-600 {
        color: rgba(255, 255, 255, 0.8) !important;
      }

      /* Allow green buttons/accents to keep their colors but make them stand out */
      .glass .text-green-500, .glass .text-green-600, .glass .dark\:text-green-400 {
        color: #4ade80 !important; /* brighter green */
        text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
      }
      
      /* Glass header */
      .glass header {
        background-color: rgba(255, 255, 255, 0.1) !important;
        backdrop-filter: blur(20px) !important;
        border-bottom: 1px solid rgba(255,255,255,0.2) !important;
      }

      /* General smooth transitions for interactive elements */
      button, a {
        transition: all 0.2s ease-in-out;
      }

      /* Animation Keyframes */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes highlight {
        from { background-color: rgba(110, 231, 183, 0.5); } /* green-300 with opacity */
        to { background-color: transparent; }
      }
      .highlight-message {
        animation: highlight 2s ease-out;
        border-radius: 0.5rem; /* Match message bubble rounding */
      }
      .highlight-search-result-active {
        background-color: rgba(250, 204, 21, 0.5); /* yellow-300 with opacity */
        border-radius: 0.5rem;
        transition: background-color 0.3s ease-in-out;
        box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.7);
      }

      @keyframes incomingMessageAnimation {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes outgoingMessageAnimation {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
      }


      /* Animation Utility Classes */
      .animation-fade-in {
        animation: fadeIn 0.2s ease-in-out;
      }
      
      .animation-fade-in-up {
        animation: fadeInUp 0.3s ease-out;
      }
      
      .animation-scale-in {
        animation: scaleIn 0.2s ease-out;
      }

      .animate-incoming-message {
        animation: incomingMessageAnimation 0.3s ease-out forwards;
      }
      
      .animate-outgoing-message {
        animation: outgoingMessageAnimation 0.2s ease-out forwards;
      }

      .animate-shake {
        animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both;
      }

      /* Utility for hiding scrollbar during screenshot capture */
      .hide-scrollbar-for-capture::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar-for-capture {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      
      /* For screen-reader accessibility */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
